services:
  postgres:
    image: postgres:16-alpine
    container_name: leaklens_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leaklens_db}
      POSTGRES_USER: ${POSTGRES_USER:-leaklens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaklens_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leaklens_user} -d ${POSTGRES_DB:-leaklens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leaklens_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-leaklens_user}:${POSTGRES_PASSWORD:-leaklens_pass}@postgres:5432/${POSTGRES_DB:-leaklens_db}
      POSTGRES_DB: ${POSTGRES_DB:-leaklens_db}
      POSTGRES_USER: ${POSTGRES_USER:-leaklens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaklens_pass}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_jwt_key_67890}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DEVICE_API_KEY_PEPPER: ${DEVICE_API_KEY_PEPPER:-leaklens_device_pepper_secret}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
