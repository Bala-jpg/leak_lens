services:
  postgres:
    image: postgres:16-alpine
    container_name: leaklens_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leaklens_db}
      POSTGRES_USER: ${POSTGRES_USER:-leaklens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leaklens_user} -d ${POSTGRES_DB:-leaklens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leaklens_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-leaklens_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-leaklens_db}
      POSTGRES_DB: ${POSTGRES_DB:-leaklens_db}
      POSTGRES_USER: ${POSTGRES_USER:-leaklens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      FRONTEND_URL: http://localhost:8080,${FRONTEND_URL:-http://localhost:5173}
      DEVICE_API_KEY_PEPPER: ${DEVICE_API_KEY_PEPPER:?Set DEVICE_API_KEY_PEPPER in .env}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leaklens_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
